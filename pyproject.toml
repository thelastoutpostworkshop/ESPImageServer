[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-image-server"
version = "1.0.21"
description = "Local text-to-image HTTP server that returns ESP32-friendly JPEGs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30",
    "diffusers>=0.35",
    "fastapi>=0.110",
    "Pillow>=10.0",
    "safetensors>=0.4",
    "transformers>=4.40,<5.0",
    "tqdm>=4.66",
    "torchvision>=0.20",
    "imageio[ffmpeg]>=2.34",
    "imageio-ffmpeg>=0.5",
    "sentencepiece>=0.2",
    "uvicorn[standard]>=0.27",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esp_image_server = ["static/*.png"]
