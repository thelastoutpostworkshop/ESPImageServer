name: Platform checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_windows_installer:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-generation-setup:
    name: Linux — Verify generation setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build small Linux base runtime
        run: python installer/build-native-runtime.py dist/setup-backend
      - name: Download, verify, reuse, and recover generation dependencies
        run: python ci/verify-generation-setup.py dist/setup-backend dist/user-generation-runtime
  tests:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows — Validate and build installer
            platform: win32
            arch: x64
          - os: ubuntu-24.04
            label: Linux — Validate and build installer
            platform: linux
            arch: x64
          - os: macos-15
            label: macOS — Compatibility checks
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ESP_IMAGE_OPEN_BROWSER: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            installer/constraints-cpu.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Verify target platform and architecture
        run: |
          python ci/check-platform.py ${{ matrix.platform }} ${{ matrix.arch }}
          node -e "require('node:assert/strict').equal(process.platform, '${{ matrix.platform }}'); require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}'); console.log('Node target verified:', process.platform, process.arch)"
      - name: Install backend test dependencies (no GPU runtime)
        run: python -m pip install -r ci/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install desktop dependencies and Electron
        run: npm --prefix desktop ci
      - name: Prepare development Python runtime for desktop smoke test
        run: python -m venv --system-site-packages .venv
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Backend tests and management-only startup
        run: python -m pytest -q --ignore=tests/test_native_storage.py
      - name: Native storage persistence and read-only installation
        run: python -m pytest tests/test_native_storage.py -v
      - name: Ensure Inno Setup is available for the Windows upgrade fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the CI Inno Setup compiler.' }
          }
      - name: Verify Windows source packaging excludes development metadata
        if: runner.os == 'Windows'
        env:
          ESP_REQUIRE_INNO_TEST: '1'
        run: python -m pytest tests/test_windows_source_packaging.py -q
      - name: Windows installer upgrade and user-data preservation
        if: runner.os == 'Windows'
        run: python ci/verify-windows-upgrade.py
      - name: Build standalone management backend
        run: python installer/build-native-runtime.py dist/native-backend
      - name: Verify relocated backend without system Python
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p 'dist/runtime-check é'
          mv dist/native-backend 'dist/runtime-check é/backend'
          'dist/runtime-check é/backend/.venv/bin/python' -I -B ci/verify-native-runtime.py 'dist/runtime-check é/backend'
      - name: Verify relocated Windows backend without system Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checkRoot = Join-Path $PWD 'dist/runtime-check é'
          New-Item -ItemType Directory -Path $checkRoot | Out-Null
          Move-Item -LiteralPath (Join-Path $PWD 'dist/native-backend') -Destination (Join-Path $checkRoot 'backend')
          $backend = Join-Path $checkRoot 'backend'
          $env:PYTHONHOME = Join-Path $checkRoot 'conflicting-python'
          $env:PYTHONPATH = Join-Path $checkRoot 'conflicting-modules'
          & (Join-Path $backend '.venv/python.exe') -I -B ci/verify-native-runtime.py $backend
          if ($LASTEXITCODE -ne 0) { throw 'Relocated Windows runtime verification failed.' }
          Copy-Item -LiteralPath (Join-Path $backend 'runtime-manifest.json') -Destination (Join-Path $backend '.venv/runtime-manifest.json')
          & (Join-Path $backend '.venv/python.exe') -I -B installer/runtime-setup.py validate (Join-Path $backend '.venv')
          if ($LASTEXITCODE -ne 0) { throw 'Windows bootstrap runtime validation failed.' }
      - name: Desktop module tests
        run: npm --prefix desktop test
      - name: Check desktop entry-point syntax
        run: node --check desktop/main.mjs
      - name: Desktop lifecycle smoke test (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix desktop run test:smoke
      - name: Desktop lifecycle smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm --prefix desktop run test:smoke
      - name: Prepare native esptool
        if: runner.os != 'Windows'
        run: python installer/prepare-native-esptool.py
      - name: Build native desktop directory bundle
        if: runner.os != 'Windows'
        run: npm --prefix desktop run build:native -- "../dist/runtime-check é/backend"
      - name: Relocate desktop bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p 'dist/Desktop bundles é'
          if [ '${{ runner.os }}' = 'Linux' ]; then
            mv desktop/release/native/linux-unpacked 'dist/Desktop bundles é/app'
          else
            mv desktop/release/native/mac-arm64 'dist/Desktop bundles é/app'
          fi
      - name: Packaged desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix desktop run test:packaged -- "../dist/Desktop bundles é/app"
      - name: Packaged desktop smoke test (macOS)
        if: runner.os == 'macOS'
        run: npm --prefix desktop run test:packaged -- "../dist/Desktop bundles é/app"
      - name: Build native installer
        if: runner.os != 'Windows'
        run: npm --prefix desktop run build:native-installer -- '../dist/Desktop bundles é/app'
      - name: Verify native upgrade, user-data preservation, repair, and removal
        if: runner.os != 'Windows'
        run: python ci/verify-native-installer.py desktop/release/installers management
      - name: Upload native installer
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/installers/*.deb
            desktop/release/installers/*.dmg
            desktop/release/installers/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Build Windows release installer
        if: runner.os == 'Windows' && inputs.build_windows_installer == true
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is missing.' }
          ./build-installer.ps1 -InnoSetupPath $compiler.FullName
          $installers = @(Get-ChildItem dist/ESPImageServer-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)`n")
      - name: Upload Windows installer
        if: runner.os == 'Windows' && inputs.build_windows_installer == true
        uses: actions/upload-artifact@v6
        with:
          name: installer-win32-x64
          path: |
            dist/ESPImageServer-Setup-*.exe
            dist/ESPImageServer-Setup-*.exe.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
