name: Platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ESP_IMAGE_OPEN_BROWSER: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            installer/constraints-cpu.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Verify target platform and architecture
        run: |
          python ci/check-platform.py ${{ matrix.platform }} ${{ matrix.arch }}
          node -e "require('node:assert/strict').equal(process.platform, '${{ matrix.platform }}'); require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}'); console.log('Node target verified:', process.platform, process.arch)"
      - name: Install backend test dependencies (no GPU runtime)
        run: python -m pip install -r ci/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install desktop dependencies and Electron
        run: npm --prefix desktop ci
      - name: Prepare development Python runtime for desktop smoke test
        run: python -m venv --system-site-packages .venv
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Backend tests and management-only startup
        run: python -m pytest -q --ignore=tests/test_native_storage.py
      - name: Native storage persistence and read-only installation
        run: python -m pytest tests/test_native_storage.py -v
      - name: Build standalone management backend
        if: runner.os != 'Windows'
        run: python installer/build-native-runtime.py dist/native-backend
      - name: Verify relocated backend without system Python
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p 'dist/runtime-check é'
          mv dist/native-backend 'dist/runtime-check é/backend'
          'dist/runtime-check é/backend/.venv/bin/python' -I -B ci/verify-native-runtime.py 'dist/runtime-check é/backend'
          tar -czf dist/backend-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C 'dist/runtime-check é' backend
      - name: Upload management backend bundle
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/backend-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Desktop module tests
        run: npm --prefix desktop test
      - name: Check desktop entry-point syntax
        run: node --check desktop/main.mjs
      - name: Desktop lifecycle smoke test (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix desktop run test:smoke
      - name: Desktop lifecycle smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm --prefix desktop run test:smoke
