name: Platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cuda:
    name: Linux CUDA backend (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ESP_IMAGE_OPEN_BROWSER: '0'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: x64
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify native target
        run: python ci/check-platform.py linux x64
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build Linux CUDA backend
        run: python installer/build-native-runtime.py dist/cuda-backend --mode cuda
      - name: Verify relocated CUDA dependencies and no-GPU startup
        run: |
          mkdir -p 'dist/CUDA runtime é'
          mv dist/cuda-backend 'dist/CUDA runtime é/backend'
          'dist/CUDA runtime é/backend/.venv/bin/python' -I -B -m pip check
          'dist/CUDA runtime é/backend/.venv/bin/python' -I -B ci/verify-native-runtime.py 'dist/CUDA runtime é/backend'
      - name: Archive CUDA backend
        run: tar -czf dist/backend-linux-x64-cuda.tar.gz -C 'dist/CUDA runtime é' backend
      - name: Upload CUDA backend
        uses: actions/upload-artifact@v6
        with:
          name: backend-linux-x64-cuda
          path: dist/backend-linux-x64-cuda.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ESP_IMAGE_OPEN_BROWSER: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            installer/constraints-cpu.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Verify target platform and architecture
        run: |
          python ci/check-platform.py ${{ matrix.platform }} ${{ matrix.arch }}
          node -e "require('node:assert/strict').equal(process.platform, '${{ matrix.platform }}'); require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}'); console.log('Node target verified:', process.platform, process.arch)"
      - name: Install backend test dependencies (no GPU runtime)
        run: python -m pip install -r ci/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install desktop dependencies and Electron
        run: npm --prefix desktop ci
      - name: Prepare development Python runtime for desktop smoke test
        run: python -m venv --system-site-packages .venv
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Backend tests and management-only startup
        run: python -m pytest -q --ignore=tests/test_native_storage.py
      - name: Native storage persistence and read-only installation
        run: python -m pytest tests/test_native_storage.py -v
      - name: Build standalone management backend
        if: runner.os != 'Windows'
        run: python installer/build-native-runtime.py dist/native-backend
      - name: Verify relocated backend without system Python
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p 'dist/runtime-check é'
          mv dist/native-backend 'dist/runtime-check é/backend'
          'dist/runtime-check é/backend/.venv/bin/python' -I -B ci/verify-native-runtime.py 'dist/runtime-check é/backend'
          tar -czf dist/backend-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C 'dist/runtime-check é' backend
      - name: Upload management backend bundle
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: backend-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/backend-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Desktop module tests
        run: npm --prefix desktop test
      - name: Check desktop entry-point syntax
        run: node --check desktop/main.mjs
      - name: Desktop lifecycle smoke test (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix desktop run test:smoke
      - name: Desktop lifecycle smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm --prefix desktop run test:smoke
      - name: Prepare native esptool
        if: runner.os != 'Windows'
        run: python installer/prepare-native-esptool.py
      - name: Build native desktop directory bundle
        if: runner.os != 'Windows'
        run: npm --prefix desktop run build:native -- "../dist/runtime-check é/backend"
      - name: Relocate desktop bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p 'dist/Desktop bundles é'
          if [ '${{ runner.os }}' = 'Linux' ]; then
            mv desktop/release/native/linux-unpacked 'dist/Desktop bundles é/app'
          else
            mv desktop/release/native/mac-arm64 'dist/Desktop bundles é/app'
          fi
      - name: Packaged desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix desktop run test:packaged -- "../dist/Desktop bundles é/app"
      - name: Packaged desktop smoke test (macOS)
        if: runner.os == 'macOS'
        run: npm --prefix desktop run test:packaged -- "../dist/Desktop bundles é/app"
      - name: Archive native desktop bundle
        if: runner.os != 'Windows'
        run: tar -czf dist/desktop-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C 'dist/Desktop bundles é/app' .
      - name: Upload native desktop bundle
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
