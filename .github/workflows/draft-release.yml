name: Prepare draft release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check tag against project version before building
        run: python ci/draft_release.py --check-tag

  checks-and-installers:
    needs: validate-tag
    uses: ./.github/workflows/platform-checks.yml
    with:
      build_windows_installer: true

  draft:
    needs: checks-and-installers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: installer-win32-x64
          path: release-assets/installer-win32-x64
      - uses: actions/download-artifact@v6
        with:
          name: installer-linux-x64
          path: release-assets/installer-linux-x64
      - name: Validate installers and create unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/draft_release.py release-assets
