<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESPImageServer</title>
    <style>
      body{box-sizing:border-box;margin:0;padding:32px 48px;display:grid;min-height:100vh;place-items:center;background:#121212;color:#fff;font:18px Segoe UI,sans-serif}
      .card{width:100%;max-width:1100px;min-width:0;text-align:center}
      .banner{display:block;width:100%;height:auto;aspect-ratio:3/1;max-height:300px;object-fit:contain;margin:0 auto 28px;opacity:0;transform:translateY(18px) scale(.985)}
      .banner.is-ready{animation:banner-reveal 900ms cubic-bezier(.22,1,.36,1) both}
      .banner[hidden]{display:none}
      .spinner{width:34px;height:34px;border:4px solid #29445c;border-top-color:#29b6f6;border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
      p{color:#c5c9d1;line-height:1.5}
      .version{margin-top:8px;color:#88a5bd;font-size:14px}
      .details{text-align:left;margin-top:28px}
      .details summary{cursor:pointer;color:#b5c9dc;font-size:14px}
      .log{box-sizing:border-box;width:100%;height:180px;margin-top:10px;padding:12px;overflow:auto;border:1px solid #29445c;border-radius:6px;background:#080d12;color:#b9d7ed;font:12px Consolas,monospace;white-space:pre-wrap}
      button{padding:10px 18px;margin:8px;border:0;border-radius:4px;background:#2196f3;color:white;font:inherit;cursor:pointer}
      button:disabled{opacity:.5}
      @keyframes banner-reveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(max-height:780px){body{padding-top:24px;padding-bottom:24px}.banner{max-height:220px;margin-bottom:20px}.details{margin-top:20px}.log{height:150px}}
      @media(max-width:600px){body{padding:24px}.banner{margin-bottom:20px}button{margin:6px}}
      @media(prefers-reduced-motion:reduce){.banner,.banner.is-ready{animation:none;transform:none}.banner.is-ready{opacity:1}.spinner{animation:none}}
    </style>
  </head>
  <body><div class="card"><img id="banner" class="banner" alt="ESPImageServer — Free local AI image and video generation for your ESP32" width="2172" height="724" /><div class="spinner"></div><strong id="title">Starting ESPImageServer</strong><p id="detail">Loading the local image-generation service…</p><div id="actions" aria-live="polite"></div><div id="version" class="version"></div><details class="details" open><summary>Startup details</summary><pre id="log" class="log">Waiting for local server output…</pre></details></div><script>
      const banner=document.getElementById('banner');
      const revealBanner=()=>banner.classList.add('is-ready');
      banner.addEventListener('load',revealBanner,{once:true});
      banner.addEventListener('error',()=>{banner.hidden=true},{once:true});
      banner.src=new URLSearchParams(location.search).get('banner')||new URL('../frontend/public/about/espimageserver-banner.png',location.href).href;
      if(banner.complete&&banner.naturalWidth)revealBanner();
      const title=document.getElementById('title'),detail=document.getElementById('detail'),log=document.getElementById('log'),version=document.getElementById('version'),appVersion=new URLSearchParams(location.search).get('version');if(appVersion)version.textContent=`Version ${appVersion}`;const applyStatus=update=>{title.textContent=update.title;detail.textContent=update.detail;document.querySelector('.spinner').hidden=Boolean(update.actions?.length);const actions=document.getElementById('actions');actions.replaceChildren();for(const item of update.actions||[]){const button=document.createElement('button');button.textContent=item.label;button.dataset.action=item.id;button.onclick=()=>{for(const b of actions.children)b.disabled=true;desktop.generationSetupAction(item.id).catch(error=>{detail.textContent=error.message;for(const b of actions.children)b.disabled=false})};actions.append(button)}},appendLines=lines=>{if(!lines.length)return;if(log.textContent==='Waiting for local server output…')log.textContent='';log.textContent+=lines.join('\n')+'\n';log.scrollTop=log.scrollHeight},desktop=window.espImageServerDesktop;desktop?.onServerStatus(applyStatus);desktop?.onServerLog(appendLines);desktop?.getStartupState().then(state=>{applyStatus(state.status);appendLines(state.lines)})</script></body>
</html>
