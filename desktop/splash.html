<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ESPImageServer</title>
    <style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#121212;color:#fff;font:18px Segoe UI,sans-serif}.card{width:calc(100vw - 96px);max-width:none;text-align:center}.spinner{width:34px;height:34px;border:4px solid #29445c;border-top-color:#29b6f6;border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}p{color:#c5c9d1;line-height:1.5}.details{text-align:left;margin-top:28px}.details summary{cursor:pointer;color:#b5c9dc;font-size:14px}.log{box-sizing:border-box;width:100%;height:180px;margin-top:10px;padding:12px;overflow:auto;border:1px solid #29445c;border-radius:6px;background:#080d12;color:#b9d7ed;font:12px Consolas,monospace;white-space:pre-wrap}@keyframes spin{to{transform:rotate(360deg)}}</style>
  </head>
  <body><div class="card"><div class="spinner"></div><strong id="title">Starting ESPImageServer</strong><p id="detail">Loading the local image-generation service…</p><details class="details" open><summary>Startup details</summary><pre id="log" class="log">Waiting for local server output…</pre></details></div><script>const title=document.getElementById('title'),detail=document.getElementById('detail'),log=document.getElementById('log'),applyStatus=update=>{title.textContent=update.title;detail.textContent=update.detail},appendLines=lines=>{if(!lines.length)return;if(log.textContent==='Waiting for local server output…')log.textContent='';log.textContent+=lines.join('\n')+'\n';log.scrollTop=log.scrollHeight},desktop=window.espImageServerDesktop;desktop?.onServerStatus(applyStatus);desktop?.onServerLog(appendLines);desktop?.getStartupState().then(state=>{applyStatus(state.status);appendLines(state.lines)})</script></body>
</html>
